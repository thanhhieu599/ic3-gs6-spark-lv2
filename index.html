<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IC3 GS6 Spark Level 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-software shell — dark title bar, white toolbar, paper question sheet on a cool grey desk, progress strip at the bottom. */
:root{
  --bg:#e9eef1; --paper:#ffffff; --ink:#1b2a33; --muted:#5a6a74; --line:#d4dde2; --line-strong:#9fb0b9;
  --bar:#173c4f; --bar-fg:#f1f7fa; --bar-icon:#173c4f; --bar-line:rgba(255,255,255,.28); --bar-warn:#ffd27a;
  --accent:#0b7a8b; --accent-fg:#ffffff; --accent-soft:#d6eef1;
  --chip:#dde4e8; --chip-hover:#cdd7dc; --sel:#173c4f; --sel-fg:#ffffff;
  --target:#173c4f; --target-fg:#f1f7fa;
  --mute-btn:#68777f; --mute-btn-fg:#ffffff;
  --ok:#1d7f46; --ok-soft:#dbf1e3; --bad:#bf3329; --bad-soft:#f8dfdc; --warn:#b06f12; --warn-soft:#fbedd3;
  --scrim:rgba(14,28,37,.48);
  --hw-body:#e3e8eb; --hw-edge:#b6c1c7; --hw-metal:#9aa5ad; --hw-port:#22292e; --hw-gold:#c9a24a; --hw-blue:#2f7fd8; --hw-ink:#28343b; --hw-field:#f7f9fa; --hw-btn-fg:#ffffff;
  --f-display:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --qs:1;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shared bar ---------- */
.titlebar{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px;flex-wrap:wrap}
.titlebar .brand{font-weight:700;letter-spacing:.02em}
.titlebar .mode{opacity:.75}
.titlebar .tb-time{margin-left:auto;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums}
.titlebar .tb-time.low{color:var(--bar-warn)}
.tb-btn{background:transparent;border:1px solid var(--bar-line);color:var(--bar-fg);border-radius:3px;padding:4px 10px;cursor:pointer;font-size:13px}
.tb-btn:hover{background:var(--bar-line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bar);color:var(--bar-fg);border:0;border-radius:3px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:36px;text-decoration:none}
.btn:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-mute{background:var(--mute-btn);color:var(--mute-btn-fg)}
.btn-end{background:var(--accent);color:var(--accent-fg)}
.btn-line{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn-line:hover{background:var(--chip);filter:none}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn .ico{width:18px;height:18px}

/* ---------- exam ---------- */
.exam{display:flex;flex-direction:column;height:100%}
.toolbar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos b{color:var(--ink)}
.ib{width:40px;height:36px;display:inline-grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--bar-icon);border-radius:3px;cursor:pointer;font:800 17px var(--f-body);letter-spacing:-.02em}
.ib:hover{background:var(--chip)}
.ib:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.ib .ico{width:25px;height:25px}
.ib.on{background:var(--accent-soft);border-color:var(--accent)}
.mark{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;margin-right:6px}
.mark input{width:18px;height:18px;accent-color:var(--warn);margin:0}
.exam.review [data-live]{display:none!important}
.exam:not(.review) [data-review]{display:none!important}

.stage{flex:1;overflow:auto;padding-block:20px 28px;padding-inline:16px}
.sheet{max-width:1180px;margin-inline:auto;background:var(--paper);border:1px solid var(--line)}
.stem{padding:20px 24px 16px;border-bottom:1px solid var(--line);font-size:calc(15px * var(--qs))}
.dom{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:6px}
.instr{margin:10px 0 0;color:var(--muted);font-size:.92em}
.figure{max-width:720px;margin-top:14px}
.figure svg,.hsbox svg{display:block;width:100%;height:auto}
.grip{text-align:center;color:var(--muted);letter-spacing:.35em;font-size:10px;padding-top:6px;user-select:none}
.answers{padding:18px 24px 26px;font-size:calc(15px * var(--qs))}
.locked .opt,.locked .chip,.locked .hs,.locked td[data-r]{cursor:default}

.opts{display:flex;flex-direction:column;gap:10px;max-width:820px;margin-inline:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chip);border:2px solid transparent;padding:12px 16px;cursor:pointer;border-radius:2px;color:var(--ink)}
.opt:hover{background:var(--chip-hover)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:50%}
.opts.multi .mk{border-radius:3px}
.opt.picked{background:var(--sel);color:var(--sel-fg)}
.opt.picked .mk{border-color:var(--sel-fg);background:var(--sel-fg);box-shadow:inset 0 0 0 3px var(--sel)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.right.missed{border-style:dashed}
.opt.right.picked .mk{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--ok-soft)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt.wrong .mk{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 3px var(--bad-soft)}
.tag{margin-left:auto;flex:none;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.tag.bad{color:var(--bad)}

.yn-wrap{overflow-x:auto}
.yn{width:100%;border-collapse:collapse;min-width:420px}
.yn th{background:var(--bar);color:var(--bar-fg);font-weight:600;padding:9px 10px;width:96px;border:1px solid var(--bar)}
.yn th:first-child{background:transparent;border:0;width:auto}
.yn td{border:1px solid var(--line-strong);padding:14px 16px}
.yn td[data-r]{text-align:center;cursor:pointer}
.yn td[data-r]:hover{background:var(--chip)}
.yn input{width:20px;height:20px;accent-color:var(--accent);margin:0;pointer-events:none}
.yn tr.right td.st{background:var(--ok-soft)}
.yn tr.wrong td.st{background:var(--bad-soft)}
.yn td.key{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.yn .verdict{display:block;font-size:.75em;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.yn tr.right .verdict{color:var(--ok)} .yn tr.wrong .verdict{color:var(--bad)}

.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px 28px;align-items:start}
.pool{display:flex;flex-direction:column;gap:10px;min-height:56px;padding:6px;border:1px dashed transparent;border-radius:3px}
.pool.over{border-color:var(--accent);background:var(--accent-soft)}
.pool-empty{color:var(--muted);font-size:.9em;text-align:center;padding:12px}
.pairs{display:flex;flex-direction:column;gap:20px;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.slot{min-height:48px;border:1px solid var(--line-strong);background:var(--paper);border-radius:2px;display:flex;flex-direction:column;justify-content:center;padding:4px;cursor:pointer}
.slot.armed{border-style:dashed;border-color:var(--accent)}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.slot.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.target{background:var(--target);color:var(--target-fg);padding:12px 16px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:2px;min-height:48px}
.chip{position:relative;display:block;width:100%;background:var(--chip);border:2px solid transparent;padding:11px 36px;text-align:center;cursor:grab;border-radius:2px;color:var(--ink);touch-action:manipulation}
.chip:hover{background:var(--chip-hover)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.dragging{opacity:.45}
.chip .mv{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.slot .chip{background:var(--chip)}
.slot.ok .chip,.slot.bad .chip{background:transparent}
.should{font-size:.85em;color:var(--bad);padding:2px 8px 4px;text-align:center}
.should b{color:var(--ink)}

.hsbox{max-width:760px;margin-inline:auto;border:1px solid var(--line)}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent;stroke:transparent;stroke-width:2}
.hs:hover .hit,.hs:focus-visible .hit{fill:var(--accent-soft);stroke:var(--accent)}
.hs.picked .hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.hs.right .hit{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
.hs.wrongpick .hit{fill:var(--bad-soft);stroke:var(--bad);stroke-width:3}
.hw-body{fill:var(--hw-body);stroke:var(--hw-edge);stroke-width:1.5}
.hw-plain{fill:var(--hw-body)}
.hw-metal{fill:var(--hw-metal)} .hw-port{fill:var(--hw-port)} .hw-gold{fill:var(--hw-gold)} .hw-blue{fill:var(--hw-blue)} .hw-field{fill:var(--hw-field)}
.hw-fill{fill:var(--hw-ink)}
.hw-ico{fill:none;stroke:var(--hw-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw-text{fill:var(--hw-ink);font-family:var(--f-body);font-size:13px}
.hw-ibtn{fill:var(--hw-body);stroke:var(--hw-edge)}
.hw-btn-text{fill:var(--hw-btn-fg);font-family:var(--f-body);font-weight:600;font-size:14px;text-anchor:middle}
.hw-big{fill:var(--hw-ink);font-family:var(--f-body);font-size:19px;text-anchor:middle}
.hw-label{fill:var(--bad);font-family:var(--f-body);font-weight:700;font-size:22px;text-anchor:middle}

.note{max-width:820px;margin:0 auto 18px;padding:10px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:14px}
.fbwrap{padding:0 24px 24px}
.fb-box{max-width:820px;margin-inline:auto;border:1px solid var(--line);background:var(--bg);padding:16px 18px;font-size:calc(14.5px * var(--qs))}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.fb-key{margin:0 0 8px}
.fb-exp{margin:0;color:var(--ink)}
.fb-check{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.foot{background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:3px}
.seg{flex:1;height:10px;min-width:0;border:0;padding:0;background:var(--line);cursor:pointer;border-radius:1px;position:relative}
.seg.ans{background:var(--accent)}
.seg.mk{background:var(--warn)}
.seg.ok{background:var(--ok)} .seg.bad{background:var(--bad)}
.seg.cur{outline:2px solid var(--ink);outline-offset:1px}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* ---------- home & result ---------- */
.page{max-width:1080px;margin-inline:auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:30px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 8px}
.hero h1{font-size:clamp(26px,4.2vw,42px);line-height:1.12;font-weight:800;letter-spacing:-.015em;max-width:22ch}
.lede{max-width:66ch;color:var(--muted);margin:12px 0 0;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:22px 0 0}
.facts div{background:var(--paper);padding:14px 16px}
.facts dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:4px 0 0;font:700 24px var(--f-mono);font-variant-numeric:tabular-nums}
.facts dd small{font:500 13px var(--f-body);color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:21px}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding-left:18px;color:var(--muted)}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.resume{background:var(--warn-soft);border:1px solid var(--warn);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.resume b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
.cb input{accent-color:var(--accent);margin:0}
.cb:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.row select{font:inherit;padding:6px 8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:3px}
.row label{display:inline-flex;gap:7px;align-items:center}
.row input[type=checkbox]{accent-color:var(--accent)}
.sec h2{font-size:20px;margin-bottom:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.num{text-align:right;font-family:var(--f-mono)}
.empty{padding:22px;color:var(--muted);text-align:center}
.small-btn{padding:4px 10px;min-height:30px;font-size:13px}

.score-head{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.score{font:700 clamp(48px,9vw,76px)/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted);font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);padding:18px}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 64px;gap:14px;align-items:center;font-size:14px}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok);border-radius:5px}
.fill.low{background:var(--bad)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.qcell{height:42px;border:1px solid var(--line-strong);background:var(--paper);font:600 14px var(--f-mono);cursor:pointer;position:relative;border-radius:2px;color:var(--ink)}
.qcell:hover{border-color:var(--accent)}
.qcell.ans{background:var(--accent-soft);border-color:var(--accent)}
.qcell.skip{border-style:dashed}
.qcell.mk::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--warn);border-radius:50%}
.qcell.cur{outline:2px solid var(--ink);outline-offset:1px}
.qcell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qcell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border:1px solid var(--line-strong);display:inline-block;background:var(--paper)}
.legend i.ans{background:var(--accent-soft);border-color:var(--accent)}
.legend i.mk{background:var(--warn);border-color:var(--warn);border-radius:50%;width:9px;height:9px}
.legend i.skip{border-style:dashed}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)} .legend i.bad{background:var(--bad-soft);border-color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line-strong);background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink)}
.tab.on{background:var(--bar);color:var(--bar-fg);border-color:var(--bar)}
.foot-note{color:var(--muted);font-size:13px;max-width:80ch}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);color:var(--ink);max-width:700px;width:100%;max-height:min(88vh,760px);overflow:auto;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal h2{font-size:20px;margin-bottom:12px}
.modal p{margin:0 0 10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-fg);padding:10px 18px;border-radius:4px;z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:760px){
  .modes{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .match{grid-template-columns:1fr}
  .pool{flex-direction:row;flex-wrap:wrap}
  .pool .chip{width:auto;flex:1 1 140px}
  .stem{padding:16px}
  .answers{padding:16px}
  .fbwrap{padding:0 16px 16px}
  .bar-row{grid-template-columns:1fr 54px}
  .bar-row .track{grid-column:1 / -1;grid-row:2}
}
@media (max-width:520px){
  .lbl{display:none}
  .toolbar{padding:8px 12px}
  .pair{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion: no-preference){
  .opt,.chip,.slot,.seg{transition:background-color .12s,border-color .12s}
}
</style>

<!-- ================= HOME ================= -->
<div id="home" class="view"></div>

<!-- ================= EXAM ================= -->
<section id="exam" class="exam" hidden>
  <div class="titlebar">
    <button class="tb-btn" id="bHome" type="button">← Trang chủ</button>
    <span class="brand">IC3 GS6 Spark · Level 2</span>
    <span class="mode" id="candName"></span>
    <span class="mode" id="modeLabel">Thi thử</span>
    <span class="tb-time" id="timer" aria-live="off">50:00</span>
  </div>
  <div class="toolbar">
    <div class="grp">
      <button class="btn" id="bPrev" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4v16M20 12H8m5-5-5 5 5 5"/></svg><span class="lbl">Trước</span></button>
      <button class="btn btn-mute" id="bReset" type="button" data-live><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span class="lbl">Đặt lại</span></button>
      <span class="pos"><b id="qpos">1/45</b> <span id="qid"></span></span>

{d:4,t:'multi',q:'Bạn cần gửi video bài tập 300 MB, nhưng email chỉ cho đính kèm tối đa 25 MB. Hai cách nào phù hợp?',
 o:['Tải video lên Google Drive/OneDrive và gửi đường liên kết','Đổi đuôi tệp thành .txt','Dùng dịch vụ gửi tệp lớn hoặc nén, chia nhỏ tệp','Chụp màn hình video để gửi','Bấm Gửi nhiều lần cho đến khi được'],a:[0,2],
 e:'Tệp lớn nên chia sẻ bằng liên kết đám mây (có thể phân quyền) hoặc dịch vụ gửi tệp lớn.'},
{d:4,t:'single',q:'Chữ ký email (signature) thường có những thông tin gì?',
 o:['Họ tên, lớp/trường hoặc chức danh, cách liên hệ','Mật khẩu email','Toàn bộ các email cũ','Nhạc nền và ảnh động'],a:0,
 e:'Chữ ký email giúp người nhận biết bạn là ai. Không bao giờ ghi mật khẩu vào email.'},
{d:4,t:'single',q:'Khi viết email cho thầy cô, điều nào nên TRÁNH?',
 o:['Lời chào phù hợp','Dùng tiếng lóng, viết tắt và nhiều biểu tượng cảm xúc','Viết ngắn gọn, rõ ràng','Kiểm tra chính tả trước khi gửi'],a:1,
 e:'Email với thầy cô, người lớn cần lịch sự, rõ ràng. Tiếng lóng, viết tắt dễ gây hiểu lầm.'},
{d:4,t:'single',q:'Thầy chủ nhiệm đi công tác một tuần và muốn ai gửi email cũng nhận được thông báo thầy vắng mặt. Thầy dùng tính năng nào?',
 o:['Chuyển tiếp (Forward) mọi email','Trả lời tự động (Automatic Replies / Out of Office)','Đánh dấu tất cả là đã đọc','Xóa hộp thư'],a:1,
 e:'Out of Office tự động trả lời người gửi trong khoảng thời gian được đặt.'},
{d:4,t:'hotspot',svg:'mail',q:'Bạn muốn gửi kèm tệp bài tập trong email này. Nhấp vào nút phù hợp.',a:4,
 e:'Biểu tượng kẹp giấy (Attach / Đính kèm) dùng để thêm tệp vào email.'},
{d:4,t:'hotspot',svg:'mail',q:'Bạn gửi bài cho cô giáo bộ môn và muốn gửi bản sao để cô chủ nhiệm cùng biết. Nhấp vào ô phù hợp để thêm địa chỉ cô chủ nhiệm.',a:2,
 e:'Cc (bản sao): người nhận ở Cc được biết thông tin, người nhận chính nằm ở To. Mọi người đều thấy địa chỉ trong ô Cc.'},
{d:4,t:'single',q:'Trong lớp học trực tuyến, khi chưa đến lượt phát biểu, bạn nên làm gì?',
 o:['Bật micro để mọi người nghe tiếng ồn xung quanh','Tắt micro (Mute) và dùng nút giơ tay khi muốn phát biểu','Rời khỏi lớp','Nói chen vào lúc thầy cô đang giảng'],a:1,
 e:'Tắt micro giúp lớp không bị ồn. Dùng tính năng Raise hand (giơ tay) hoặc khung chat để xin phát biểu.'},
{d:4,t:'multi',q:'Hai việc nào là quy tắc lịch sự khi học trực tuyến qua video?',
 o:['Vào lớp đúng giờ, chuẩn bị chỗ ngồi gọn gàng','Dùng khung chat đúng mục đích, lịch sự','Chia sẻ đường link lớp học lên mạng xã hội','Ăn uống trước camera','Đổi tên hiển thị thành tên vui nhộn'],a:[0,1],
 e:'Đúng giờ, gọn gàng, chat lịch sự. Không chia sẻ link lớp công khai vì người lạ có thể vào phá.'},
{d:4,t:'single',q:'Nhóm chat của lớp có 40 bạn. Bạn muốn hỏi riêng một bạn về chuyện cá nhân. Bạn nên làm gì?',
 o:['Hỏi trong nhóm chat lớp','Nhắn tin riêng (tin nhắn trực tiếp) cho bạn đó','Đăng lên trang cá nhân','Gửi email cho cả lớp'],a:1,
 e:'Chuyện riêng nên nhắn riêng. Nhóm chung dành cho thông tin cả lớp cần biết.'},

/* ======================= 6. CỘNG TÁC (13) ======================= */
{d:5,t:'multi',q:'Nhóm bạn cùng làm bài báo cáo trên Google Docs hoặc Word Online. Ba lợi ích của việc cùng soạn thảo trực tuyến là gì?',
 o:['Nhiều bạn cùng sửa một tệp cùng lúc','Không cần Internet','Xem và khôi phục bản cũ nhờ lịch sử phiên bản','Viết bình luận, gắn tên @bạn để giao việc','Mỗi người làm một bản rồi tự ghép lại'],a:[0,2,3],
 e:'Cùng soạn thảo trực tuyến giúp không phải gửi qua lại nhiều bản. Cần Internet để đồng bộ.'},
{d:5,t:'single',q:'Bạn chia sẻ tài liệu và chỉ muốn bạn bè góp ý bằng bình luận, không sửa nội dung. Bạn chọn quyền nào?',
 o:['Người xem (Viewer)','Người nhận xét (Commenter)','Người chỉnh sửa (Editor)','Chủ sở hữu (Owner)'],a:1,
 e:'Commenter được bình luận, góp ý nhưng không sửa trực tiếp.'},
{d:5,t:'yesno',q:'Với mỗi phát biểu về lịch sử phiên bản (version history), hãy chọn Yes nếu đúng hoặc No nếu sai.',

 e:'Khôi phục bản cũ thường tạo ra một bản mới, các bản khác vẫn còn. Lịch sử phiên bản là tính năng của Google Drive, OneDrive.'},
{d:5,t:'single',q:'Nhóm bạn cần hẹn giờ học nhóm online tuần này. Cách nào tiện nhất?',
 o:['Mỗi người tự nhớ giờ','Tạo sự kiện trên lịch chung (Google Calendar / Outlook) và gửi lời mời kèm link họp cho cả nhóm','Hẹn miệng ở trường','Đăng giờ học lên mạng xã hội công khai'],a:1,
 e:'Lời mời trên lịch tự nhắc mọi người, có link họp và cho biết ai đồng ý tham gia.'},
{d:5,t:'match',q:'Ghép mỗi quyền chia sẻ với việc người đó được làm.',
 items:['Chủ sở hữu (Owner)','Người chỉnh sửa (Editor)','Người nhận xét (Commenter)','Người xem (Viewer)'],

 e:'Chỉ cấp quyền vừa đủ cho việc cần làm.'},
{d:5,t:'single',q:'Bạn chia sẻ thư mục ảnh của lớp có ảnh các bạn. Cách chia sẻ nào an toàn nhất?',
 o:['Ai có link cũng được chỉnh sửa','Đăng công khai lên mạng','Chỉ chia sẻ cho email của các bạn trong lớp, quyền Xem','Gửi mật khẩu tài khoản của bạn cho cả lớp'],a:2,
 e:'Chia sẻ cho đúng người, quyền thấp nhất cần thiết. Link "ai cũng xem được" có thể bị chuyển ra ngoài.'},
{d:5,t:'single',q:'Nhóm bạn cần theo dõi: ai làm phần nào, hạn nộp, đã xong chưa. Công cụ nào phù hợp?',
 o:['Ứng dụng quản lý công việc như Microsoft Planner, Trello','Máy tính bỏ túi','Trình phát nhạc','Ứng dụng chỉnh ảnh'],a:0,
 e:'Planner/Trello có các thẻ công việc với người phụ trách, hạn chót và trạng thái (Cần làm – Đang làm – Đã xong).'},
{d:5,t:'single',q:'Trong Google Docs, bạn muốn nhắc bạn Lan sửa một đoạn văn. Cách nhanh nhất là gì?',
 o:['Viết chữ in hoa vào giữa bài','Thêm bình luận và gõ @Lan để Lan nhận thông báo','Xóa đoạn văn đó','Gọi điện cho cả nhóm'],a:1,

{d:5,t:'single',q:'Một bạn trong nhóm lỡ xóa mất phần bài của bạn khác trên tài liệu chung. Làm sao lấy lại?',
 o:['Viết lại từ đầu','Mở Lịch sử phiên bản và khôi phục bản trước khi bị xóa','Tạo tài liệu mới','Không thể lấy lại'],a:1,
 e:'Google Docs: File > Version history. Word Online: File > Info > Version History.'},
{d:5,t:'yesno',q:'Với mỗi phát biểu về làm việc nhóm online, hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Nên chia việc rõ ràng cho từng thành viên.','Nên đặt hạn chót cho từng phần việc.','Một bạn nên làm hết để nhanh hơn.','Nên tôn trọng ý kiến của các bạn khi góp ý.'],a:[1,1,0,1],
 e:'Làm việc nhóm hiệu quả: phân công rõ, có hạn chót, góp ý tôn trọng, mọi người cùng tham gia.'},
{d:5,t:'match',order:true,q:'Sắp xếp các bước làm một dự án nhóm trực tuyến theo đúng thứ tự.',

{d:5,t:'single',q:'Trong buổi họp nhóm trên Teams hoặc Google Meet, bạn muốn cả nhóm cùng xem slide trên máy của bạn. Bạn dùng tính năng nào?',
 o:['Tắt camera','Chia sẻ màn hình (Share screen / Present)','Rời cuộc họp','Đổi hình nền'],a:1,
 e:'Chia sẻ màn hình giúp mọi người thấy đúng nội dung bạn đang trình bày.'},
{d:5,t:'hotspot',svg:'word',q:'Bạn muốn mời bạn cùng nhóm vào chỉnh sửa tài liệu này. Nhấp vào nút phù hợp.',a:9,
 e:'Nút Chia sẻ (Share) ở góc phải cho phép nhập email người nhận và chọn quyền: chỉnh sửa, nhận xét hoặc chỉ xem.'},

/* ======================= 7. AN TOÀN & BẢO MẬT (16) ======================= */
{d:6,t:'multi',q:'Bạn vừa đăng ký một tài khoản Google. Tài khoản mới của bạn dùng Đăng nhập một lần (SSO).\nBa lợi ích của Đăng nhập một lần (SSO) là gì?',
 o:['Bạn chỉ cần nhớ một bộ thông tin đăng nhập','SSO thuộc sở hữu và do chính phủ điều hành','Đăng nhập một lần là dùng được email, lưu trữ tài liệu, ứng dụng và trang web liên kết','Tài khoản SSO không bao giờ bị tấn công','Ít mật khẩu hơn nên dễ bảo vệ tài khoản chính bằng mật khẩu mạnh và xác thực 2 bước'],a:[0,2,4],
 e:'SSO tiện lợi, nhưng nếu lộ tài khoản chính thì mọi dịch vụ liên kết đều bị ảnh hưởng, nên phải bật xác thực 2 bước.'},
{d:6,t:'single',q:'Mật khẩu nào mạnh nhất?',

 e:'Mật khẩu mạnh: dài từ 12 ký tự, có chữ hoa, chữ thường, số và ký hiệu, không chứa tên hoặc ngày sinh.'},
{d:6,t:'match',q:'Ghép mỗi mối nguy trên mạng với mô tả phù hợp.',
 items:['Lừa đảo (Phishing)','Mã độc tống tiền (Ransomware)','Trojan','Phần mềm gián điệp (Spyware)','Tường lửa (Firewall)'],
 targets:['Tin nhắn giả mạo dụ bạn nhập mật khẩu','Khóa toàn bộ tệp và đòi tiền chuộc','Trò chơi "miễn phí" nhưng giấu mã độc bên trong','Lén theo dõi những gì bạn làm trên máy'],a:[0,1,2,3],
 e:'Tường lửa là công cụ bảo vệ, không phải mối nguy.'},
{d:6,t:'single',q:'Ví dụ nào là xác thực hai yếu tố (2FA)?',
 o:['Nhập mật khẩu hai lần','Nhập mật khẩu, sau đó nhập mã gửi về điện thoại','Trả lời hai câu hỏi bí mật','Có hai mật khẩu cho hai tài khoản'],a:1,
 e:'2FA kết hợp hai loại khác nhau: thứ bạn biết (mật khẩu) + thứ bạn có (điện thoại) hoặc thứ thuộc về bạn (vân tay).'},
{d:6,t:'yesno',q:'Với mỗi phát biểu về Wi-Fi công cộng (quán cà phê, trung tâm thương mại), hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Không nên đăng nhập tài khoản quan trọng khi dùng Wi-Fi công cộng không mật khẩu.','VPN giúp mã hóa kết nối khi dùng Wi-Fi công cộng.','Wi-Fi có tên giống tên quán chắc chắn là của quán.','Nên tắt tự động kết nối với Wi-Fi lạ.'],a:[1,1,0,1],
 e:'Kẻ xấu có thể phát Wi-Fi giả trùng tên. Hãy hỏi nhân viên đúng tên mạng.'},
{d:6,t:'hotspot',svg:'browser',q:'Bạn muốn kiểm tra trang web có kết nối bảo mật hay không. Nhấp vào vị trí phù hợp trên trình duyệt.',a:3,
 e:'Biểu tượng ổ khóa ở đầu thanh địa chỉ cho biết kết nối có được mã hóa không và hiển thị thông tin chứng chỉ của trang.'},
{d:6,t:'single',q:'Dấu hiệu nào cho thấy email có thể là lừa đảo?',
 o:['Email của thầy cô gửi đúng lịch học đã báo','Địa chỉ người gửi lạ, viết sai tên, giục bạn "đăng nhập trong 24 giờ kẻo mất tài khoản" qua đường link','Email có chữ ký và số điện thoại trường','Thông báo lịch họp từ lịch của lớp'],a:1,
 e:'Lừa đảo thường: người gửi lạ hoặc giả tên, tạo cảm giác gấp gáp, đòi mật khẩu/mã OTP, có đường link lạ.'},
{d:6,t:'single',q:'Quy tắc sao lưu 3-2-1 nghĩa là gì?',
 o:['3 mật khẩu, 2 tài khoản, 1 máy','3 bản sao dữ liệu, trên 2 loại thiết bị lưu trữ, 1 bản để ở nơi khác (như đám mây)','Sao lưu 3 lần mỗi ngày','3 ổ cứng trong 1 máy'],a:1,
 e:'Quy tắc 3-2-1 giúp không mất dữ liệu khi hỏng máy, mất máy hay bị mã độc.'},
{d:6,t:'multi',q:'Hai cách nào giúp bảo vệ dữ liệu nếu bạn làm mất điện thoại?',
 o:['Đặt khóa màn hình bằng mã PIN, vân tay hoặc khuôn mặt','Bật tính năng Tìm thiết bị (Find My Device / Find My iPhone)','Ghi mật khẩu dán sau ốp lưng','Tắt mọi bản cập nhật','Để điện thoại không khóa cho tiện'],a:[0,1],
 e:'Khóa màn hình chặn người lạ; Tìm thiết bị giúp định vị, khóa và xóa dữ liệu từ xa.'},
{d:6,t:'single',q:'Chữ "S" trong HTTPS nghĩa là gì?',
 o:['Speed: nhanh hơn','Secure: dữ liệu được mã hóa khi truyền đi','Server: máy chủ riêng','Search: đã được Google kiểm tra'],a:1,
 e:'HTTPS mã hóa đường truyền, nhưng không đảm bảo trang đó đáng tin. Trang lừa đảo cũng có thể dùng HTTPS.'},
{d:6,t:'yesno',q:'Với mỗi phát biểu về quyền của ứng dụng, hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Ứng dụng đèn pin đòi xem danh bạ là đáng ngờ.','Nên xem lại các quyền khi cài ứng dụng mới.','Có phần mềm diệt virus là an toàn tuyệt đối, không cần cập nhật.','Nên tải ứng dụng từ Google Play hoặc App Store.'],a:[1,1,0,1],
 e:'Chỉ cấp quyền mà ứng dụng thật sự cần. Phần mềm diệt virus phải được cập nhật thường xuyên.'},
{d:6,t:'single',q:'Bạn nhận tin nhắn: "Chúc mừng bạn trúng thưởng điện thoại! Bấm link và nhập số thẻ ngân hàng của bố mẹ để nhận quà". Bạn nên làm gì?',
 o:['Nhập ngay kẻo hết hạn','Gửi cho bạn bè cùng nhận','Không bấm link, báo bố mẹ và xóa tin nhắn','Nhắn lại hỏi thêm'],a:2,
 e:'Đây là lừa đảo. Không bấm link, không cung cấp thông tin thẻ hay mã OTP; báo người lớn.'},
{d:6,t:'single',q:'Một người lạ quen trên game online xin địa chỉ nhà và ảnh của bạn. Bạn nên làm gì?',

 rows:['Một người bạn rất biết lắng nghe và cố gắng thấu hiểu cảm xúc của người khác.','Một thầy/cô không trả lời email sau vài tháng.','Một học sinh cư xử tốt bụng với mọi người khi ở trước mặt, nhưng nói những điều sai sự thật và làm người khác tổn thương trên mạng.'],a:[1,0,0],
 e:'Lắng nghe, thấu hiểu là ứng xử đúng mực. Không phản hồi email quá lâu và nói xấu người khác trên mạng là ứng xử không đúng mực.'},
{d:1,t:'single',q:'Trong các tùy chọn sau, tùy chọn nào là một phần của dấu chân kĩ thuật số?',
 o:['Số đôi giày mà em sở hữu.','Những lượt/nội dung tìm kiếm mà em thực hiện trên Internet.','Những điều em nói trong tin nhắn dạng chữ với bạn bè.','Điểm số của em ở trường.'],a:1,
 e:'Lượt tìm kiếm trên Internet được lưu lại và tạo thành dấu chân kĩ thuật số của em.'},
{d:1,t:'yesno',cols:['Đúng','Sai'],q:'Em là một người dám lên tiếng bênh vực khi gặp hành vi bắt nạt trực tuyến (Cyberbullying). Với mỗi câu phát biểu về việc lên tiếng bênh vực, em hãy chọn Đúng hoặc Sai.',
 rows:['Liên hệ và hỏi thăm người đang bị bắt nạt. Hỏi xem em có thể làm gì để giúp đỡ.','Trả đũa người có hành vi bắt nạt.','Dừng lại và nói chuyện này cho người lớn.'],a:[1,0,1],
 e:'Người bênh vực hỗ trợ nạn nhân và báo người lớn, không trả đũa vì sẽ làm mọi việc tệ hơn.'},
{d:1,t:'single',q:'Em đặt mua một game mới nhưng khi nhận được thì phát hiện rằng đó là một bản sao chép trái phép, không phải game chính hãng. Cách phản ứng thích hợp của một công dân tốt trên môi trường kĩ thuật số là:',
 o:['Trước khi cài đặt, thiết lập tường lửa cho máy tính để chặn kết nối đến Internet.','Loan tin trên mạng xã hội để mọi người biết nơi mua được bản sao giá rẻ của trò chơi đó.','Yêu cầu hoàn tiền và thông báo cho cửa hàng rằng bản game em nhận được không phải loại chính hãng.','Chạy phần mềm chống virus cho đĩa game rồi mới cài đặt, vì có thể có virus trong game.'],a:2,
 e:'Dùng bản sao lậu là vi phạm bản quyền. Công dân số tốt không dùng, không quảng bá hàng lậu mà yêu cầu hoàn tiền và báo cho cửa hàng.'},
{d:1,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu, em hãy chọn Đúng hoặc Sai.',
 rows:['Bình luận, hình ảnh và các thông tin khác mà em đăng trên mạng được gọi là dấu chân kĩ thuật số của em.','Em có thể xóa vĩnh viễn những bình luận tiêu cực khỏi Internet bất cứ khi nào em muốn.','Mỗi bài tập ở trường mà em hoàn thành đều là một phần của dấu chân kĩ thuật số.'],a:[1,0,0],
 e:'Nội dung đã đăng có thể bị sao chép, lưu lại nên không xóa vĩnh viễn được. Bài tập làm trên giấy không để lại dấu vết trên Internet nên không phải bài nào cũng là dấu chân kĩ thuật số.'},
{d:1,t:'single',q:'Tùy chọn nào dưới đây là một ví dụ về Cyberbullying?',
 o:['Để lại những ghi chú gây tổn thương trên bàn của ai đó ở trường.','Lan truyền tin đồn về ai đó trong giờ học.','Gửi tin nhắn gây tổn thương cho ai đó trực tuyến.','Nói những điều gây tổn thương về ai đó trong bữa ăn trưa.'],a:2,
 e:'Cyberbullying là bắt nạt qua thiết bị số, trên mạng. Các lựa chọn còn lại là bắt nạt trực tiếp.'},
{d:6,t:'multi',q:'Trong các tùy chọn sau, tùy chọn nào là ví dụ về hành vi Hack?',
 o:['Dùng tài khoản chung để đăng nhập.','Dùng một chương trình để truy cập vào máy tính của người khác mà chưa được cho phép.','Hỏi xin mật khẩu của người khác.','Dùng email gửi đi một loại virus máy tính có khả năng làm hại máy tính của người khác.'],a:[1,3],
 e:'Hack là xâm nhập hoặc gây hại hệ thống máy tính khi không được phép: truy cập trái phép, phát tán virus.'},
{d:1,t:'single',q:'Tùy chọn nào dưới đây KHÔNG phải là một ví dụ về Cyberbullying?',

 e:'Nói xấu trực tiếp trong bữa trưa là bắt nạt, nhưng không diễn ra trên mạng nên không phải Cyberbullying.'},
{d:1,t:'multi',q:'Tùy chọn nào là những hành vi sử dụng công nghệ kĩ thuật số ở trường học phù hợp?',
 o:['Học sinh nên chia sẻ mật khẩu cho nhau biết.','Học sinh và giáo viên không nên dùng mạng xã hội trong lớp học.','Học sinh nên mở loa ngoài khi xem video, thay vì dùng tai nghe.','Học sinh không nên đánh cắp hoặc làm hư hại tài sản của người khác.'],a:[1,3],
 e:'Không dùng mạng xã hội trong giờ học và tôn trọng tài sản của người khác. Không chia sẻ mật khẩu, dùng tai nghe để không làm phiền người khác.'},
{d:6,t:'multi',q:'Vì sao người dùng nên bảo vệ danh tính trực tuyến của họ?',
 o:['Người dùng không cần bảo vệ danh tính trực tuyến.','Người dùng thường không sử dụng hình ảnh thật của họ.','Người dùng luôn nói thật khi trực tuyến.','Internet có bộ nhớ lâu dài.'],a:[1,3],
 e:'Trên mạng, nhiều người không dùng ảnh và danh tính thật nên khó biết họ là ai; Internet lại lưu thông tin rất lâu. Vì vậy cần bảo vệ danh tính của mình.'},
{d:6,t:'single',q:'Em hãy cho biết, Hack là gì?',
 o:['Dùng máy tính công cộng, như ở thư viện.','Chơi game trực tuyến với những người khác.','Xâm nhập vào một hệ thống máy tính.','Tải một ứng dụng đáng tin.'],a:2,
 e:'Hack là xâm nhập trái phép vào hệ thống máy tính hoặc mạng.'},
{d:4,t:'single',q:'Khi tham gia trực tuyến, có người gửi cho em tin nhắn khiếm nhã. Em nên phản ứng như thế nào cho phù hợp?',
 o:['Trả lời theo cách công khai.','Dừng lại và nói chuyện này cho người lớn.','Phớt lờ tin nhắn và không nói cho ai biết.','Trả lời lại và yêu cầu người kia dừng hành vi của họ.'],a:1,
 e:'Không đáp trả; dừng lại và báo người lớn tin cậy để được giúp đỡ.'},
{d:1,t:'single',q:'Điều gì KHÔNG phải là một phần của dấu chân kĩ thuật số (Footprint) của em?',
 o:['Mua hàng trực tuyến.','Đăng ký nhận bản tin email.','Bài đăng trên mạng xã hội.','Nhạc được lưu trên ổ cứng máy tính.'],a:3,
 e:'Nhạc lưu trên ổ cứng chỉ ở trong máy, không để lại dấu vết trên Internet.'},
{d:1,t:'multi',q:'Tùy chọn nào sau đây là những thông tin thuộc dấu chân kĩ thuật số?',
 o:['Email mà em gửi đi.','Cuộc gọi điện thoại mà em nhận được.','Bài tập ở trường mà em nộp (trực tuyến).','Trang web mà em truy cập.'],a:[0,2,3],
 e:'Email, bài tập nộp trực tuyến và lịch sử truy cập web đều lưu dấu vết trên mạng. Cuộc gọi điện thoại thông thường thì không.'},
{d:1,t:'single',q:'Phản ứng thích hợp nếu em bị bắt nạt trực tuyến (Cyberbullying) là gì?',
 o:['Làm gì đó để trả thù.','Bỏ qua nó và không làm gì cả.','Ngừng sử dụng máy tính.','Dừng lại, tạm dừng, nói chuyện với người lớn.'],a:3,
 e:'Quy tắc "Dừng lại – Tạm dừng – Nói với người lớn": không trả đũa, giữ bằng chứng và tìm sự giúp đỡ.'},
{d:0,t:'single',q:'Tùy chọn nào sau đây là dịch vụ dựa trên Internet?',
 o:['Chia đôi màn hình chơi game (Split-Screen Gaming)','Bách khoa toàn thư (Encyclopedia)','Thư điện tử (Email)','Microsoft'],a:2,
 e:'Email cần Internet để gửi và nhận thư. Microsoft là tên công ty, không phải dịch vụ.'},
{d:0,t:'multi',q:'Thiết bị chuột trên máy tính bảng đã được thay thế bằng những tùy chọn nào?',
 o:['Bút chì (Pencil)','Chuột kĩ thuật số (Digital Mouse)','Bút cảm ứng (Stylus)','Màn hình cảm ứng (Touch Screen)'],a:[2,3],
 e:'Trên máy tính bảng, người dùng chạm trực tiếp lên màn hình cảm ứng hoặc dùng bút cảm ứng (stylus).'},
{d:0,t:'single',q:'Tùy chọn nào là phương pháp cho phép truy cập và cập nhật các tập tin trực tuyến?',
 o:['Email','Ổ cứng ngoài','Lưu trữ đám mây','Bộ lưu trữ USB'],a:2,
 e:'Lưu trữ đám mây cho phép mở và chỉnh sửa tệp trực tuyến từ mọi thiết bị có Internet.'},
{d:0,t:'single',q:'Thiết bị nào KHÔNG có camera?',
 o:['Chuông cửa thông minh (Smart Doorbell)','Apple iPhone','Google Chromebook','Tai nghe Bluetooth (Bluetooth Headset)'],a:3,
 e:'Tai nghe Bluetooth chỉ có loa và micro, không có camera.'},
{d:6,t:'multi',q:'Phần mềm virus ảnh hưởng đến hệ thống máy tính như thế nào?',
 o:['Xóa hoặc làm hỏng dữ liệu','Liên quan đến một cuộc tấn công DoS','Phá hủy bo mạch chủ','Thu thập và chuyển thông tin cá nhân'],a:[0,3],
 e:'Virus có thể xóa, làm hỏng dữ liệu và đánh cắp thông tin cá nhân. Virus không phá hủy được phần cứng như bo mạch chủ.'},
{d:2,t:'match',q:'Em mở trình duyệt web để hoàn thành một dự án nghiên cứu. Chọn hành động đúng để hoàn thành các câu sau (mỗi từ dùng một lần, có từ không dùng đến).',
 items:['điều hướng đến','tải lại','đánh dấu','in','đóng'],
 targets:['(1) Để bắt đầu tìm kiếm, em phải ___ một trang trên Internet.','(2) Em đang đọc tài liệu thì trang bị đứng hoàn toàn, nên em phải ___ trang đó.','(3) Em muốn sau này có thể truy cập lại vào trang web, nên em ___ trang web.'],a:[0,1,2],
 e:'Điều hướng đến (mở) trang web để bắt đầu; tải lại (Reload) khi trang bị đứng; đánh dấu (Bookmark) để truy cập lại sau.'},
{d:2,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu về mục đích của nội dung trực tuyến, em hãy chọn Đúng hoặc Sai.',
 rows:['Mục đích của video hài hước là để cung cấp thông tin.','Mục đích của việc gửi email là để giao tiếp.','Mục đích của các bài báo tin tức trên mạng là để giải trí.'],a:[0,1,0],
 e:'Video hài hước để giải trí; email để giao tiếp; bài báo tin tức để cung cấp thông tin.'},
{d:2,t:'single',q:'Bạn muốn mua một vật phẩm mới cho trò chơi trực tuyến yêu thích và vật phẩm đó sẽ được khuyến mãi trong 5 phút nữa. Bạn đã mở sẵn trang đó ra chờ. Hết 5 phút, bạn nên làm gì để nhanh chóng hiển thị mức giá mới?',
 o:['Gửi email cho công ty bán hàng','Tải lại trang','In trang đó ra','Đánh dấu trang đó'],a:1,
 e:'Tải lại (Reload/Refresh) lấy phiên bản mới nhất của trang từ máy chủ.'},
{d:2,t:'match',q:'Ghép từng định nghĩa với thuật ngữ tương ứng.',
 items:['Biểu mẫu (Form)','Điều hướng (Navigate)','Tải lại (Reload)','Dấu trang (Bookmark)'],
 targets:['Một cửa sổ hoặc màn hình chứa rất nhiều trường hoặc ô trống để nhập dữ liệu','Cung cấp bản mới nhất của trang web','Khám phá để nắm rõ một ứng dụng hoặc trang web','Lưu địa chỉ một trang web trong danh sách yêu thích (Favorite)'],a:[0,2,1,3],
 e:'Form – các ô để nhập dữ liệu; Reload – lấy bản mới nhất; Navigate – di chuyển, khám phá trang; Bookmark – lưu trang yêu thích.'},
{d:1,t:'single',q:'Điều gì KHÔNG phải là một ví dụ về việc sử dụng công nghệ kĩ thuật số một cách thích hợp ở trường học?',
 o:['Tiến hành nghiên cứu trực tuyến cho một bài báo em đang viết.','In một bài luận để nộp cho một giáo viên.','Sử dụng máy ảnh của trường để chụp ảnh cho một dự án nhóm.','Chơi game hầu hết thời gian trong ngày.'],a:3,
 e:'Chơi game cả ngày ở trường là không phù hợp; các lựa chọn khác phục vụ học tập.'},
{d:4,t:'single',q:'Trong các tùy chọn sau, tùy chọn nào là ứng xử phù hợp trên môi trường kĩ thuật số (Digital Etiquette)?',
 o:['Duy trì tính tích cực trong tin nhắn và bài đăng của em.','Đăng các thông điệp có tính phỉ báng trên mạng.','Đưa sự hài hước và châm biếm vào tin nhắn.','Dùng các nguồn giả trên mạng.'],a:0,
 e:'Giữ thái độ tích cực là quy tắc ứng xử số. Châm biếm qua tin nhắn dễ bị hiểu lầm vì người đọc không thấy nét mặt, giọng nói.'},
{d:6,t:'yesno',cols:['Có','Không'],q:'Em hãy chọn Có nếu đó là dữ liệu an toàn mà em có thể chia sẻ trên mạng hoặc chọn Không nếu không phải.',
 rows:['Mật khẩu của bạn.','Tên của bạn.','Trường học của bạn.','Ngày sinh của bạn.'],a:[0,1,0,0],
 e:'Tên (không kèm thông tin khác) có thể chia sẻ. Mật khẩu, trường học và ngày sinh giúp kẻ xấu tìm ra em hoặc đoán mật khẩu, nên giữ kín.'},
{d:6,t:'multi',q:'Tùy chọn nào là đúng khi nói đến duyệt web trực tuyến an toàn?',
 o:['Các trình duyệt có tính năng bảo mật có thể an toàn hơn các trình duyệt khác.','Chỉ cung cấp thông tin cá nhân cho các trang web an toàn.','Em phải xóa các tập tin Internet tạm thời.','Em hoàn toàn an toàn miễn là em không tải xuống bất cứ thứ gì.'],a:[0,1],
 e:'Trình duyệt có tính năng bảo mật giúp an toàn hơn; chỉ nhập thông tin trên trang web tin cậy (https). Không tải gì vẫn có thể gặp lừa đảo.'},
{d:1,t:'single',q:'Thông tin nào là một phần của dấu chân kĩ thuật số (Digital Footprint) của em?',
 o:['Nhạc được lưu trên ổ cứng máy tính.','Bài đăng trên mạng xã hội.','Bưu thiếp và thư em gửi cho một người bạn qua bưu điện.','Biên lai mua hàng tại một cửa hàng địa phương.'],a:1,
 e:'Bài đăng trên mạng xã hội để lại dấu vết trên Internet. Các lựa chọn khác không diễn ra trên mạng.'},
{d:6,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu về hành vi Hack, em hãy chọn Đúng hoặc Sai.',
 rows:['Xâm nhập vào một hệ thống máy tính được coi là hành vi Hack.','Lập trình để tạo ra một ứng dụng có thể tự động gửi tin nhắn cho bạn bè được coi là hành vi Hack.','Tải trò chơi về máy tính của em được coi là hành vi Hack.'],a:[1,0,0],
 e:'Hack là xâm nhập trái phép. Lập trình ứng dụng hay tải game hợp pháp không phải là hack.'},
{d:1,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu sau đây, em hãy chọn Đúng nếu là hành vi bắt nạt trực tuyến và chọn Sai nếu không phải.',
 rows:['Hành vi cố ý gây bẽ mặt người khác bằng cách chia sẻ thông tin riêng tư.','Đây là hành vi trái luật và bị cơ quan hành pháp xử lí nghiêm trọng.','Hành vi gửi, đăng hoặc chia sẻ nội dung ác ý.'],a:[1,0,1],
 e:'Chia sẻ thông tin riêng tư để làm bẽ mặt và đăng nội dung ác ý là bắt nạt trực tuyến. Câu (b) nói về hậu quả pháp lý, không mô tả một hành vi bắt nạt.'},
/* ======================= ĐỀ ÔN TẬP SỐ 7 ======================= */
{d:0,t:'single',q:'Tùy chọn nào sau đây là thành phần quan trọng nhất được sử dụng để chạy các ứng dụng?',
 o:['Bộ lưu trữ','Card màn hình','Thẻ SIM','Bộ nhớ'],a:3,

{d:0,t:'single',q:'Em gọi các thiết bị máy tính được kết nối với nhau có thể trao đổi dữ liệu và chia sẻ tài nguyên là gì?',
 o:['Ethernet','Bluetooth','Mạng máy tính (Computer Network)','Bộ nhớ (Memory)'],a:2,
 e:'Mạng máy tính là các thiết bị kết nối với nhau để trao đổi dữ liệu, chia sẻ tài nguyên như máy in, Internet.'},
{d:0,t:'yesno',cols:['Đầu vào','Đầu ra'],q:'Em hãy chọn đúng loại chức năng (Thiết bị đầu vào hoặc Thiết bị đầu ra) cho từng thiết bị sau.',
 rows:['Chuột (Mouse)','Bàn di chuột cảm ứng (Touchpad)','Màn hình (Monitor)','Bàn phím (Keyboard)','Máy in (Printer)'],a:[1,1,0,1,0],
 e:'Chuột, touchpad, bàn phím đưa dữ liệu vào máy (đầu vào). Màn hình, máy in đưa kết quả ra (đầu ra).'},
{d:0,t:'single',q:'Tùy chọn nào dưới đây hỗ trợ chức năng cơ bản và điều khiển các phần khác nhau của máy tính?',
 o:['Dữ liệu (Data)','Đầu ra (Output)','Hệ điều hành (OS)','Đầu vào (Input)'],a:2,
 e:'Hệ điều hành điều khiển phần cứng và hỗ trợ các chức năng cơ bản của máy tính.'},
{d:0,t:'multi',q:'Tùy chọn nào là những ưu điểm của điện toán đám mây?',
 o:['Cần có kết nối Internet để hoạt động.','Truy cập bất cứ nơi nào có kết nối Internet.','Dung lượng lưu trữ có trả phí.','Khả năng chia sẻ mọi thứ với nhiều người.','Tự động sao lưu dự phòng.','Nhóm quyền truy cập vào cùng một tài liệu.'],a:[1,3,4,5],
 e:'Ưu điểm: truy cập mọi nơi, chia sẻ dễ, tự động sao lưu, nhiều người cùng làm một tài liệu. Cần Internet và phải trả phí là hạn chế.'},
{d:0,t:'single',q:'Tùy chọn nào sau đây là một thiết bị đầu vào (Input Device)?',
 o:['Micro','Máy in (Printer)','Máy chiếu (Projector)','Loa (Speaker)'],a:0,
 e:'Micro thu âm thanh vào máy. Máy in, máy chiếu, loa là thiết bị đầu ra.'},
{d:0,t:'multi',q:'Tùy chọn nào sau đây là lợi thế của việc sử dụng USB để lưu trữ các tập tin so với lưu trữ điện toán đám mây?',
 o:['Các tập tin của em an toàn hơn.','Em không cần kết nối Internet để truy cập các tập tin.','USB có thể chứa nhiều dữ liệu hơn.','USB không có giới hạn dung lượng.'],a:[0,1],
 e:'USB nằm trong tay em nên không bị truy cập từ xa và dùng được khi không có Internet. USB vẫn có giới hạn dung lượng.'},
{d:0,t:'single',q:'Tùy chọn nào sau đây là thiết bị có vai trò lưu trữ thông tin cho hệ điều hành, phần mềm và phần cứng?',
 o:['Card âm thanh','Bộ nguồn','Bộ nhớ','Màn hình'],a:2,
 e:'Bộ nhớ (Memory/Storage) lưu trữ thông tin cho hệ điều hành, phần mềm và phần cứng.'},
{d:0,t:'single',q:'Tùy chọn nào dưới đây là thuật ngữ chỉ kết quả mà máy tính tạo ra, chẳng hạn như thông tin, âm thanh và hình ảnh?',
 o:['Ổ cứng (Hard Drive)','Đầu ra (Output)','Bộ nhớ (Memory)','Hệ điều hành (OS)'],a:1,
 e:'Output (đầu ra) là kết quả máy tính tạo ra: chữ, âm thanh, hình ảnh.'},
{d:0,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi phát biểu về cáp và kết nối không dây, chọn Đúng hoặc Sai.',
 rows:['Có thể dùng cáp USB để cấp dữ liệu và nguồn điện cho một thiết bị.','Có thể dùng kết nối Bluetooth để cấp dữ liệu và nguồn điện cho một thiết bị.','Có thể dùng bộ chia USB Hub để cắm nhiều thiết bị vào cùng một cổng USB duy nhất.'],a:[1,0,1],
 e:'Cáp USB truyền cả dữ liệu và điện. Bluetooth chỉ truyền dữ liệu, không cấp điện. USB Hub mở rộng một cổng thành nhiều cổng.'},
{d:0,t:'single',q:'Hạn chế của máy tính bảng so với máy tính xách tay là gì?',
 o:['Không thể thực hiện cuộc gọi video.','Không có quyền truy cập email.','Một số ứng dụng sẽ không cài đặt được trên máy tính bảng.','Không thể chỉnh sửa tài liệu.'],a:2,

{d:0,t:'single',q:'Loại phần mềm hệ thống nào quản lí tất cả các phần mềm và phần cứng trên máy tính?',

{d:0,t:'multi',q:'Tùy chọn nào sau đây là những thiết bị có thể được ghép nối không dây với máy tính?',

{d:0,t:'single',q:'Bluetooth là gì?',
 o:['Một quy trình cài đặt để kết nối hai thiết bị với nhau.','Công nghệ không dây tầm ngắn dùng để kết nối với một thiết bị.','Một loại công nghệ cần dùng dây cáp để kết nối với một thiết bị.','Một loại công nghệ dùng phần mềm để kết nối với từ ba thiết bị trở lên.'],a:1,

{d:0,t:'single',q:'Loại giao tiếp nào cho phép hai thiết bị giao tiếp bằng cách đặt chúng cách nhau trong vòng 2 inch (khoảng 5 cm)?',
 o:['Ethernet','WiFi','NFC (Near Field Communication)','Bluetooth'],a:2,

{d:0,t:'single',q:'Chương trình nào sau đây phải được cài đặt để hệ điều hành máy tính có thể hiểu được một thiết bị máy in mới?',
 o:['Wizard','Firewall','Installer','Driver'],a:3,

{d:0,t:'multi',q:'Trong các tùy chọn sau, tùy chọn nào là các thiết bị đầu ra (Output Device)?',

{d:0,t:'single',q:'Tùy chọn nào sau đây là một lợi thế lớn của máy tính bảng?',

{d:0,t:'multi',q:'Những thiết bị nào sau đây phụ thuộc nhiều vào công nghệ lưu trữ điện toán đám mây?',
 o:['Smartphone','Tablet','Desktop','Laptop'],a:[0,1],
 e:'Điện thoại và máy tính bảng có bộ nhớ nhỏ nên phụ thuộc nhiều vào lưu trữ đám mây.'},
{d:2,t:'single',q:'Địa chỉ của một trang web được gọi là gì?',

{d:0,t:'single',q:'Loại kết nối không dây nào sau đây sẽ cho phép em tải hình ảnh từ máy ảnh vào máy tính?',
 o:['VGA','HDMI','Bluetooth','RCA'],a:2,

{d:0,t:'multi',q:'Hai lợi ích của việc tải xuống (Download) tập tin thay vì phát trực tuyến (Stream) tập tin đó là gì?',
 o:['Phát trực tuyến có khả năng phát lại mượt mà hơn.','Sau khi tải xuống hoàn tất, quá trình phát lại đáng tin cậy hơn.','Tập tin đã được tải xuống không yêu cầu kết nối Internet để phát lại.','Không yêu cầu dung lượng lưu trữ.','Không cần phải đợi trước khi chạy tập tin.'],a:[1,2],
 e:'Tệp đã tải về phát ổn định, không giật và không cần Internet. Đổi lại, tệp tốn dung lượng và phải chờ tải xong.'},
{d:0,t:'single',q:'Các thiết bị di động có dung lượng bộ nhớ hạn chế so với máy tính để bàn. Tùy chọn nào sau đây có khả năng làm cho thiết bị di động của em hết dung lượng bộ nhớ?',
 o:['Thường xuyên quên xóa bộ nhớ đệm.','Cài quá nhiều game.','Sạc thiết bị di động trước khi hết pin.','Truyền phát các video HD.'],a:1,
 e:'Game chiếm nhiều dung lượng lưu trữ. Xem video trực tuyến không lưu tệp vào máy.'},
{d:0,t:'single',q:'Hệ điều hành (OS) là gì?',
 o:['Khu vực làm việc của màn hình máy tính.','Một cái gì đó đi vào máy tính.','Thiết bị vật lý lưu trữ thông tin cho hệ điều hành, phần mềm và phần cứng.','Phần mềm hỗ trợ các chức năng cơ bản của máy tính.'],a:3,
 e:'Hệ điều hành là phần mềm hỗ trợ các chức năng cơ bản. Khu vực làm việc là Desktop; thứ đi vào máy là Input; thiết bị lưu trữ là bộ nhớ.'},
{d:0,t:'single',q:'Tùy chọn nào dưới đây có thể được sử dụng để truyền dữ liệu không dây giữa hai thiết bị gần nhau?',
 o:['Ethernet','Bluetooth','Firewall','Modem'],a:1,
 e:'Bluetooth truyền dữ liệu không dây tầm gần. Ethernet dùng cáp; Firewall là tường lửa; Modem kết nối Internet.'},
{d:0,t:'multi',q:'Tùy chọn nào sau đây là cách để tăng không gian lưu trữ cho điện thoại thông minh?',
 o:['Truyền phát video ở định dạng SD','Đóng tất cả các chương trình nền đang chạy','Gỡ cài đặt bất kì trò chơi nào mà em không chơi nữa','Xóa ảnh cũ mà em không cần'],a:[2,3],
 e:'Gỡ ứng dụng không dùng và xóa ảnh cũ giải phóng bộ nhớ lưu trữ. Đóng chương trình nền chỉ giải phóng RAM.'},
{d:6,t:'single',q:'Hành động nỗ lực khai thác hệ thống máy tính hoặc mạng riêng bên trong máy tính được gọi là gì?',
 o:['Bystander','Công dân kỉ nguyên số (Digital Citizenship)','Hacking','Dấu chân kĩ thuật số (Digital Footprint)'],a:2,
 e:'Hacking là xâm nhập, khai thác trái phép hệ thống máy tính hoặc mạng.'},
{d:0,t:'single',q:'Thiết bị nào trong số này là thiết bị nhập (Input Device)?',
 o:['Keyboard','Monitor','Speaker','Printer'],a:0,
 e:'Keyboard (bàn phím) là thiết bị nhập; màn hình, loa, máy in là thiết bị xuất.'},
{d:0,t:'multi',q:'Thiết bị lưu trữ được đo lường bằng đơn vị nào sau đây?',
 o:['Centimeters','Inches','Gigabytes','Feet','Terabytes'],a:[2,4],
 e:'Dung lượng lưu trữ đo bằng byte: KB, MB, GB, TB. Centimeters, inches, feet là đơn vị đo chiều dài.'},
{d:0,t:'single',q:'Hầu hết các điện thoại thông minh đều có tùy chọn gói dữ liệu di động. Tùy chọn nào mô tả chính xác dữ liệu di động là gì?',
 o:['Truy cập Internet không dây có tính phí, được đo bằng mức tiêu thụ dữ liệu.','Em được phép gửi bao nhiêu tin nhắn văn bản.','Điện thoại của em có bao nhiêu bộ nhớ.','Em được phân bổ bao nhiêu thời gian để gọi điện thoại.'],a:0,
 e:'Dữ liệu di động (3G/4G/5G) là truy cập Internet qua nhà mạng, tính phí theo lượng dữ liệu dùng.'},
/* ======================= ĐỀ ÔN TẬP SỐ 8 ======================= */
{d:4,t:'yesno',cols:['Đúng','Sai'],q:'Em hãy chọn Đúng hoặc Sai với mỗi phát biểu về việc giao tiếp kĩ thuật số.',
 rows:['Đồng cảm là khả năng thấu hiểu và chia sẻ cảm xúc với người khác.','Quy tắc ứng xử kĩ thuật số là quy tắc ứng xử đúng đắn trên Internet.','Tôn trọng là khi em mong một việc gì đó xảy ra hai lần.'],a:[1,1,0],
 e:'Tôn trọng là đối xử tử tế, coi trọng cảm xúc và quyền của người khác, không phải "mong một việc xảy ra hai lần".'},
{d:4,t:'match',q:'Ghép từng ví dụ với loại giao tiếp phù hợp.',
 items:['Trò chuyện bằng video','Email','Nhắn tin trong ứng dụng','Tin nhắn văn bản'],
 targets:['Dùng điện thoại di động để cho ai đó biết là em sẽ đến muộn so với giờ đã hẹn','Trò chuyện (Chat) với bạn bè khi đang chơi điện tử','Gửi bài tập đã hoàn thành với nhiều tài liệu đính kèm cho giáo viên','Giao tiếp trực diện với những người dùng Internet khác thông qua webcam'],a:[3,2,1,0],
 e:'Báo đến muộn – tin nhắn văn bản (SMS); chat khi chơi game – nhắn tin trong ứng dụng; gửi bài kèm tệp – email; dùng webcam – trò chuyện video.'},
{d:4,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu về hoạt động giao tiếp trên môi trường số, em hãy chọn Đúng hoặc Sai.',
 rows:['Phép xã giao trên môi trường số là bộ quy tắc giúp định hướng cách mọi người tương tác xã hội trên mạng.','Vì em đang không giao tiếp mặt đối mặt nên tôn trọng là điều không cần thiết.','Đồng cảm là khả năng thấu hiểu rằng phía sau thiết bị bên kia là một con người thật và có cảm xúc.'],a:[1,0,1],
 e:'Trên mạng vẫn cần tôn trọng, vì phía sau màn hình là người thật có cảm xúc.'},
{d:4,t:'match',q:'Ghép từng ví dụ với hướng dẫn thực hành phép xã giao trực tuyến tương ứng.',
 items:['Tránh ghi toàn chữ IN HOA','Tôn trọng quyền riêng tư của người khác','Gửi tin nhắn vào thời gian thích hợp','Không trao đổi thông tin về người khác khi chưa hỏi ý kiến họ'],
 targets:['KÍNH GỬI THẦY/CÔ','Gửi tin nhắn trực tiếp cho giáo viên vào nửa đêm ngày cuối tuần','Hai người bạn trò chuyện về một bạn cùng lớp trong phần nhắn tin trực tiếp','Một bạn cùng lớp đăng ảnh về em mà chưa hỏi ý kiến'],a:[0,2,3,1],
 e:'Chữ IN HOA – tránh viết hoa toàn bộ; nhắn nửa đêm – chọn thời gian phù hợp; bàn tán về bạn – không trao đổi thông tin người khác; đăng ảnh chưa xin phép – tôn trọng quyền riêng tư.'},
{d:4,t:'single',q:'Tùy chọn nào là cách giao tiếp thích hợp trên môi trường kĩ thuật số?',
 o:['Dùng toàn chữ IN HOA để trả lời tin nhắn.','Dùng lời lẽ quan tâm, hòa nhã trên ứng dụng nhắn tin.','Chia sẻ địa chỉ của em trên mạng xã hội.','Trả lời email của giáo viên và gọi giáo viên bằng tên trêu chọc theo kiểu ác ý.'],a:1,
 e:'Lời lẽ quan tâm, hòa nhã là giao tiếp tích cực trên mạng.'},
{d:4,t:'yesno',cols:['Thích hợp','Không thích hợp'],q:'Em là thành viên của một diễn đàn trực tuyến về bóng chày. Có người bình luận: "Tôi hiện sống ở New Jersey, nhưng từng sống ở Florida hơn 40 năm. Florida Pythons sẽ luôn là đội tôi yêu!". Với mỗi câu trả lời, hãy chọn Thích hợp hoặc Không thích hợp.',
 rows:['"Có phải chú đã quá già để còn mê bóng chày không nhỉ? Bóng chày là môn cho người trẻ mà, thật đấy."','"Cháu có thể hiểu được sao chú lại thích đội Pythons. Nếu sống ở Florida, chắc cháu cũng sẽ rất yêu mến họ!"','"Pythons là một đội kém cỏi, ông chú thích họ nên cũng cùng một giuộc, thế nhé!"'],a:[0,1,0],
 e:'Chỉ câu (b) thể hiện sự đồng cảm và tôn trọng. Chê bai tuổi tác hay xúc phạm người khác là không thích hợp.'},
{d:4,t:'single',q:'Em nên phản hồi như thế nào cho phù hợp với một bài đăng trên diễn đàn mạng hỏi về những sở thích cá nhân của mọi người?',
 o:['Tôi thích chơi bóng chày với bạn bè sau giờ học. Có thể tôi sẽ tham gia đội tuyển khu vực địa phương mùa tới.','Tôi sưu tập tem. Hãy cho tôi biết bạn sống ở đâu, tôi sẽ đến tận nhà và cho bạn xem bộ sưu tập tem của tôi.','Sưu tập đồng xu là sở thích của tôi. Jack sưu tập tem, anh ta sống trên con phố lớn trong khu. Bạn có muốn tôi kể ra những đồng xu đáng giá mà Jack có không?','TÔI THÍCH CHƠI ĐIỆN TỬ VỚI BẠN MINH! CHÚNG TÔI CHƠI KHI LÀM XONG BÀI TẬP!'],a:0,
 e:'Câu A chia sẻ sở thích mà không lộ thông tin riêng tư. B hỏi địa chỉ, C tiết lộ thông tin của người khác, D viết toàn chữ IN HOA.'},
{d:4,t:'single',q:'Tập tin đính kèm email là gì?',
 o:['Một cách để định dạng email.','Một đường liên kết trong email.','Một tập tin được gửi kèm trong email.','Một biểu tượng trong email.'],a:2,
 e:'Tệp đính kèm (attachment) là tệp được gửi cùng email, như ảnh, tài liệu.'},
{d:2,t:'single',q:'Khi em tìm kiếm một chủ đề và thấy từ "Ads/Sponsored" bên cạnh một số liên kết, điều đó có nghĩa là gì?',
 o:['Máy tính của em bị nhiễm virus.','Đây là một mục được tài trợ mà ai đó đã trả tiền.','Em sẽ mất tiền nếu nhấp vào liên kết.','Tìm kiếm của em không mang lại đủ kết quả.'],a:1,
 e:'Ads/Sponsored là kết quả quảng cáo, người ta đã trả tiền để được hiển thị.'},
{d:3,t:'single',q:'Tính năng nào được sử dụng cùng tính năng Find, sẽ thay thế văn bản sau khi nó được tìm thấy?',
 o:['Thay thế (Replace)','Thay thế (Substitute)','Thay đổi (Change)','Thu hồi (Retrieve)'],a:0,
 e:'Find and Replace (Ctrl + H) tìm và thay thế văn bản.'},
{d:2,t:'single',q:'Điều gì có nghĩa là kiếm tiền cho chủ sở hữu trang web khi bạn tìm kiếm trực tuyến?',
 o:['Từ đồng nghĩa (Synonyms)','Kết quả tìm kiếm','Tin nhắn trong ứng dụng (In-App Messages)','Quảng cáo (Ads)'],a:3,
 e:'Quảng cáo (Ads) mang lại doanh thu cho chủ trang web khi người dùng xem hoặc nhấp vào.'},
{d:3,t:'single',q:'Tùy chọn nào dưới đây là một ứng dụng trình chiếu?',
 o:['Microsoft Excel','Gmail','Google Docs','Microsoft PowerPoint'],a:3,
 e:'PowerPoint là ứng dụng trình chiếu; Excel là bảng tính; Gmail là email; Google Docs soạn văn bản.'},
{d:3,t:'single',q:'Alignment trong tài liệu là gì?',
 o:['Khi các thành viên của một nhóm làm việc cùng nhau.','Nội dung được sắp xếp như thế nào trên trang.','Văn bản xuất hiện bên dưới một hình ảnh.','Những người em mong đợi sẽ đọc nội dung của em.'],a:1,
 e:'Alignment (căn lề) là cách sắp xếp nội dung trên trang: trái, giữa, phải, đều hai bên.'},
{d:3,t:'single',q:'Văn bản được thêm vào bảng (Table) trong tài liệu Word như thế nào?',
 o:['Văn bản được nhập thủ công khi người dùng nhấp chuột vào ô và bắt đầu nhập.','Văn bản không khả dụng cho bảng trong tài liệu Word.','Văn bản được chèn qua thẻ Insert.','Văn bản được nhập tự động.'],a:0,
 e:'Nhấp chuột vào ô của bảng rồi gõ nội dung.'},
{d:3,t:'single',q:'Tiêu đề (Title) là gì?',
 o:['Nguồn thông tin trong tài liệu.','Cách ứng dụng xác thực người dùng.','Các từ và cụm từ giới thiệu chủ đề của một tài liệu hoặc nội dung công việc.','Văn bản xuất hiện bên dưới một hình ảnh.'],a:2,
 e:'Tiêu đề giới thiệu chủ đề chính. Văn bản dưới hình ảnh là chú thích (Caption).'},
{d:3,t:'single',q:'Trong Microsoft Word, tùy chọn nào cho biết lỗi chính tả?',
 o:['Một đường lượn sóng màu xanh.','Một đường lượn sóng màu đỏ.','Một vòng tròn màu xanh lam.','Một vòng tròn màu đỏ.'],a:1,
 e:'Lượn sóng đỏ là lỗi chính tả; lượn sóng xanh (hoặc gạch đôi xanh) là lỗi ngữ pháp.'},
{d:3,t:'single',q:'Chú thích (Caption) là gì?',
 o:['Một mô tả văn bản dưới một hình ảnh.','Một mô tả ngắn về nội dung sắp tới.','Cách văn bản được sắp xếp trên trang.','Những người bạn mong đợi sẽ đọc nội dung của bạn.'],a:0,
 e:'Caption là dòng mô tả ngắn đặt dưới (hoặc cạnh) hình ảnh.'},
{d:4,t:'single',q:'Posting có nghĩa là gì?',
 o:['Những cách chúng ta thể hiện sự tôn trọng và lòng tốt trực tuyến.','Đưa một cái gì đó lên Internet.','Chấp nhận ai đó hoặc điều gì đó ngay cả khi em không đồng ý hoặc không hiểu.','Có thể hiểu người khác có thể cảm thấy như thế nào.'],a:1,
 e:'Posting (đăng bài) là đưa nội dung lên Internet.'},
{d:2,t:'single',q:'Tùy chọn nào dưới đây là một ví dụ về giải trí?',
 o:['Một từ điển trực tuyến.','Gửi email cho giáo viên của em.','Một bảng tính điểm của em.','Truyền trực tuyến (Streaming) một chương trình.'],a:3,
 e:'Xem chương trình trực tuyến là giải trí; từ điển cung cấp thông tin; email để giao tiếp.'},
{d:4,t:'single',q:'Điều nào KHÔNG phải là một phần của thực hành giao tiếp tốt?',
 o:['Phép lịch sự (Etiquette)','Căn chỉnh (Alignment)','Đồng cảm (Empathy)','Sự tôn trọng (Respect)'],a:1,
 e:'Alignment là thuật ngữ định dạng văn bản, không liên quan đến giao tiếp.'},
{d:4,t:'single',q:'Khi nào sử dụng trò chuyện video là KHÔNG phù hợp?',
 o:['Nói chuyện với cha mẹ khi họ đi công tác.','Hỏi giáo viên của em về một bài tập lúc 2 giờ sáng.','Nói chuyện với một thành viên gia đình ở một quốc gia khác.','Làm việc trên một dự án nhóm với các bạn cùng lớp.'],a:1,
 e:'Gọi video cho thầy cô lúc 2 giờ sáng là không đúng thời gian, làm phiền người khác.'},
{d:4,t:'single',q:'Tùy chọn nào sau đây là ví dụ về nghi thức thích hợp trong một email?',
 o:['Viết toàn bộ nội dung email trong dòng chủ đề.','Viết các câu một cách rời rạc.','Chỉ gửi một dòng văn bản trong mỗi email.','Hãy lịch sự và dành thời gian để viết đúng chính tả.'],a:3,
 e:'Email lịch sự, đúng chính tả thể hiện sự tôn trọng người nhận.'},
{d:1,t:'single',q:'Tại sao phải cẩn thận với những gì được đăng trên Internet?',
 o:['Tất cả những gì được đăng trên Internet đều được mọi người tha thứ.','Không cần phải cẩn thận với những gì được đăng trên Internet.','Tất cả người dùng trên Internet thực hành nghi thức phù hợp.','Khi đăng một điều gì đó trên Internet, thì sẽ không thể xóa hoàn toàn khỏi Internet.'],a:3,
 e:'Nội dung đã đăng có thể bị sao chép, lưu lại và tồn tại mãi trên mạng.'},
{d:4,t:'multi',q:'Hành vi nào sau đây là ví dụ về nghi thức trực tuyến kém?',
 o:['Đăng video chú mèo của em đang đuổi theo một chú cún trên YouTube.','Tạo một hồ sơ chuyên nghiệp trên LinkedIn và một hồ sơ xã hội trên Facebook.','Gửi email với toàn bộ nội dung được viết bằng chữ IN HOA.','Quảng bá sản phẩm mà em bán trong một nhóm Facebook không liên quan.'],a:[2,3],
 e:'Viết IN HOA toàn bộ (như la hét) và quảng cáo trong nhóm không liên quan (spam) là nghi thức kém.'},
{d:4,t:'single',q:'Em sắp đi một chuyến tham quan ngoại khóa và giáo viên cần gửi giấy xin phép cho cả lớp. Giáo viên nên sử dụng phương thức giao tiếp nào?',
 o:['Email','Gọi điện thoại','Đăng lên mạng xã hội','Gọi video'],a:0,
 e:'Email gửi được cho nhiều người cùng lúc, kèm tệp giấy xin phép và lưu lại làm bằng chứng.'},
{d:4,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu về ứng xử thích hợp khi tham gia trực tuyến, em hãy chọn Đúng hoặc Sai.',
 rows:['Rất dễ nhận ra và hiểu được cảm xúc qua tin nhắn kĩ thuật số.','Viết toàn chữ IN HOA khi nhắn tin chỉ ra rằng người đó có cách giao tiếp đúng đắn và thái độ hào hứng.','Nhắn tin ngắn gọn và rõ ràng giúp người nhận hiểu được ý định của em.'],a:[0,0,1],
 e:'Tin nhắn không có nét mặt, giọng nói nên cảm xúc dễ bị hiểu lầm. Viết IN HOA bị coi là la hét.'},
{d:4,t:'yesno',cols:['Tích cực','Tiêu cực'],q:'Em hãy chọn "tích cực" hoặc "tiêu cực" để hoàn thành các câu sau.',
 rows:['Đối xử với người khác theo cách em muốn được đối xử là một ví dụ về cách giao tiếp …','Tôn trọng quyền riêng tư của người khác là một ví dụ về cách giao tiếp …','Dùng lời lẽ thô lỗ hoặc không thích hợp là một ví dụ về cách giao tiếp …'],a:[1,1,0],
 e:'Đối xử tử tế và tôn trọng riêng tư là giao tiếp tích cực; lời lẽ thô lỗ là tiêu cực.'},
{d:4,t:'multi',q:'Tùy chọn nào sau đây là đúng khi nói về tập tin đính kèm email?',
 o:['Không có giới hạn về kích thước của các tập tin đính kèm.','Người nhận email có thể tải xuống tập tin đính kèm.','Các tập tin như hình ảnh, video và tài liệu có thể được đính kèm.','Em chỉ có thể đính kèm một tập tin cho mỗi email.'],a:[1,2],
 e:'Có thể đính kèm nhiều loại tệp và người nhận tải về được. Tệp đính kèm có giới hạn dung lượng (Gmail khoảng 25 MB) và một email đính kèm được nhiều tệp.'},
{d:4,t:'single',q:'Trước khi bấm Gửi một email quan trọng cho giáo viên, em nên làm gì?',
 o:['Gửi ngay để tiết kiệm thời gian.','Viết thêm nhiều biểu tượng cảm xúc cho vui.','Kiểm tra lại người nhận, tiêu đề, tệp đính kèm và lỗi chính tả.','Xóa dòng tiêu đề để email ngắn gọn hơn.'],a:2,
 e:'Email đã gửi thường không thu hồi được; hãy kiểm tra kỹ trước khi gửi.'},
{d:4,t:'single',q:'Em lỡ gửi một tin nhắn khiến bạn hiểu lầm và buồn. Cách xử lý phù hợp nhất là:',
 o:['Im lặng, coi như không có chuyện gì.','Nhắn lời xin lỗi chân thành và giải thích rõ ý của mình.','Chặn tài khoản của bạn đó.','Đăng chuyện này lên mạng xã hội để mọi người phân xử.'],a:1,
 e:'Xin lỗi chân thành và giải thích rõ giúp hàn gắn hiểu lầm.'},
/* ======================= ĐỀ ÔN TẬP SỐ 9 ======================= */
{d:2,t:'single',q:'Cách nhanh nhất để quay lại một trang web sau đó là gì?',
 o:['Nói với một người bạn về trang web bạn tìm thấy.','In toàn bộ trang web.','Viết URL trên một tờ giấy.','Tạo dấu trang.'],a:3,
 e:'Dấu trang (Bookmark) lưu trang web trong trình duyệt, mở lại chỉ bằng một cú nhấp.'},
{d:2,t:'single',q:'Chương trình nào sau đây sử dụng từ khóa để tìm kết quả trong các trang web trên Internet?',
 o:['Công cụ tìm kiếm (Search Engine)','Trình chặn cửa sổ bật lên (Pop-up Blocker)','Phần mềm diệt virus (Antivirus Software)','Diễn đàn (Forum)'],a:0,
 e:'Công cụ tìm kiếm (Google, Bing) dùng từ khóa để tìm trang web phù hợp.'},
{d:2,t:'single',q:'Điều nào sau đây là sự khác biệt giữa Wiki và Forum?',
 o:['Wiki cho phép em nói về một chủ đề cụ thể trong khi Forum thì không.','Forum cho phép em nói về một chủ đề cụ thể trong khi Wiki thì không.','Wiki là một phần của trang web, trong khi Forum tạo nên toàn bộ trang web.','Forum là một phần của trang web, trong khi Wiki tạo nên toàn bộ trang web.'],a:3,
 e:'Diễn đàn (Forum) thường là một mục trong trang web để thảo luận; Wiki (như Wikipedia) là cả trang web do cộng đồng cùng viết, sửa.'},
{d:2,t:'single',q:'Thao tác nào khi em buộc một trình duyệt truy xuất một trang web từ máy chủ thay vì tải từ bộ đệm?',
 o:['Đánh dấu trang (Bookmarking)','Điều hướng (Navigating)','Tải lại (Reloading)','Gửi biểu mẫu (Submitting a form)'],a:2,
 e:'Tải lại (Reload) lấy lại trang mới nhất từ máy chủ.'},
{d:2,t:'single',q:'Khi em sử dụng từ đồng nghĩa để làm rõ mục tiêu tìm kiếm, em đang làm gì?',
 o:['Làm cho tìm kiếm càng rộng càng tốt.','Bỏ qua các quảng cáo trong một công cụ tìm kiếm.','Sử dụng các từ tương tự hoặc giống với tìm kiếm ban đầu để tinh chỉnh kết quả.','Giới hạn kết quả tìm kiếm chỉ cho các trang web giáo dục.'],a:2,
 e:'Từ đồng nghĩa là từ có nghĩa tương tự, giúp tinh chỉnh và tìm thêm kết quả phù hợp.'},
{d:2,t:'single',q:'Em nên làm gì nếu trang web chỉ tải được một nửa?',
 o:['Tải lại trang web.','Dừng lại, tạm dừng, nói chuyện với người lớn.','Hãy thử lại vào một ngày khác.','Khởi động lại máy tính.'],a:0,
 e:'Tải lại trang là cách đơn giản, nhanh nhất khi trang tải không hết.'},
{d:2,t:'single',q:'Tại sao có thể nói là hữu ích khi sử dụng từ đồng nghĩa trong tìm kiếm của em?',
 o:['Kết quả tìm kiếm không chính xác nếu không.','Nó loại bỏ quảng cáo trong kết quả tìm kiếm.','Nó thu hẹp tìm kiếm chỉ các trang web giáo dục.','Để tinh chỉnh hoặc mở rộng kết quả tìm kiếm.'],a:3,
 e:'Từ đồng nghĩa giúp tinh chỉnh hoặc mở rộng kết quả khi từ khóa ban đầu chưa hiệu quả.'},
{d:2,t:'yesno',cols:['Đúng','Sai'],q:'Em hãy chọn Đúng hoặc Sai cho từng phát biểu về việc tinh chỉnh phạm vi tìm kiếm trên web.',
 rows:['Công cụ tìm kiếm thực hiện tìm theo đúng trình tự từ khóa mà em nhập vào.','Khi thêm từ OR, công cụ tìm kiếm sẽ kết hợp nhiều kết quả tìm kiếm thành một.','Kết quả tìm kiếm trả phí (Ads) trông giống các kết quả tìm kiếm không trả phí và được sắp xếp chung với nhau.'],a:[0,1,1],
 e:'Công cụ tìm kiếm không giữ đúng thứ tự từ khóa (trừ khi dùng dấu ngoặc kép). OR gộp kết quả của các từ khóa. Quảng cáo trông giống kết quả thường, chỉ khác nhãn Ads/Sponsored.'},
{d:3,t:'single',q:'Giáo viên yêu cầu em tìm hiểu về rừng mưa nhiệt đới và chia sẻ những điều học được với bạn cùng lớp thông qua một bài trình chiếu. Mục đích của bài trình chiếu này là gì?',
 o:['Để giải trí','Để thuyết phục','Để giao tiếp','Để cung cấp thông tin'],a:3,
 e:'Chia sẻ kiến thức đã tìm hiểu là cung cấp thông tin.'},
{d:2,t:'multi',q:'Khi tìm kiếm trên web mà không tìm được kết quả phù hợp, em nên thực hiện các bước nào để tinh chỉnh phạm vi tìm kiếm?',
 o:['Thử lại mà không thay đổi gì cả.','Dùng từ đồng nghĩa hoặc các từ thay thế khác.','Nhấp vào một quảng cáo.','Dùng các bộ lọc.'],a:[1,3],
 e:'Đổi từ khóa (từ đồng nghĩa) và dùng bộ lọc (thời gian, loại kết quả) giúp tinh chỉnh tìm kiếm.'},
{d:2,t:'single',q:'Tùy chọn nào là định nghĩa cho hành động "điều hướng trên Internet"?',
 o:['Gửi dữ liệu hoặc tập tin từ máy tính của bạn.','Cập nhật những gì đang được hiển thị.','Nhấp và xem qua các tài nguyên.','Lưu URL để tham khảo trong tương lai.'],a:2,
 e:'Điều hướng (Navigate) là nhấp chuột, di chuyển giữa các trang để xem tài nguyên. "Cập nhật" là tải lại; "lưu URL" là đánh dấu trang.'},
{d:2,t:'single',q:'Trang web cho phép chơi game trực tuyến miễn phí là loại trang web gì?',
 o:['Thông tin','Mạng xã hội','Giải trí','Giao tiếp'],a:2,
 e:'Trang chơi game phục vụ mục đích giải trí.'},
{d:2,t:'match',q:'Ghép từng hoạt động trực tuyến với mục đích tương ứng.',
 items:['Giao tiếp','Giải trí','Thông tin'],
 targets:['Xem đoạn video hài hước về một chú chó đi xe máy','Gửi email cho giáo viên của em về bài tập bị thiếu','Dùng Google Scholar để tìm kiếm một chủ đề cho bài tập'],a:[1,0,2],
 e:'Video hài – giải trí; email cho giáo viên – giao tiếp; Google Scholar – tìm thông tin.'},
{d:2,t:'single',q:'Em có thể làm gì để lưu lại trang web khi muốn quay lại sau?',
 o:['Đánh dấu trang (Bookmark) cho URL đó.','Nói cho một người em biết.','Nhờ ai đó gợi nhắc cho em.','Cố nhớ vào lần đăng nhập tới.'],a:0,
 e:'Bookmark lưu URL trong trình duyệt để mở lại nhanh.'},
{d:2,t:'single',q:'Em đang tìm một số thông tin trên mạng nhưng kết quả trả về không cung cấp thông tin mà em cần. Em nên làm gì?',
 o:['Dùng từ đồng nghĩa để thay đổi thuật ngữ tìm.','Bấm vào đường liên kết của những kết quả quảng cáo.','Đóng trình duyệt của em.','Kiểm tra kết nối Internet của em.'],a:0,
 e:'Đổi từ khóa bằng từ đồng nghĩa giúp tìm được kết quả phù hợp hơn.'},
{d:2,t:'single',q:'Em đang đọc một bài viết trên trang web. Bên dưới có nhiều đường liên kết cung cấp thêm thông tin. Em nên nhấp vào liên kết nào để tìm hiểu về người viết bài báo?',
 o:['Phiên bản di động (Mobile Version)','Chính sách quyền riêng tư (Privacy Policy)','Điều khoản sử dụng (Terms of Use)','Tác giả (Author)'],a:3,
 e:'Liên kết Tác giả (Author) cho biết thông tin về người viết, giúp đánh giá độ tin cậy.'},
{d:2,t:'single',q:'Giáo viên yêu cầu em đính kèm URL của trang web đã dùng vào bài nộp. Tùy chọn nào là ví dụ về một URL?',
 o:['com.NatgeoKids.www','http://www.natgeokids.com/visit-the-mountains','www.natgeokids','NatgeoKids.com'],a:1,
 e:'URL đầy đủ gồm giao thức (http://), tên miền (www.natgeokids.com) và đường dẫn (/visit-the-mountains).'},
{d:2,t:'single',q:'Khi bắt đầu làm dự án nghiên cứu, giáo viên gửi cho em https://www.natgeokids.com để sử dụng. Em đã được nhận gì từ giáo viên?',
 o:['Một URL','Tiêu đề một trang','Mã nguồn','Một tác giả'],a:0,
 e:'https://www.natgeokids.com là một URL (địa chỉ trang web).'},
{d:2,t:'match',q:'Ghép từng mục đích với ví dụ về nội dung trực tuyến tương ứng.',
 items:['Trò chơi trực tuyến','Ứng dụng nhắn tin tức thời (Instant Message)','Trang hướng dẫn'],
 targets:['Giao tiếp','Giải trí','Cung cấp thông tin'],a:[1,0,2],
 e:'Nhắn tin – giao tiếp; trò chơi – giải trí; trang hướng dẫn – cung cấp thông tin.'},
{d:2,t:'yesno',cols:['Đúng','Sai'],q:'Với mỗi câu phát biểu về trình duyệt web, hãy chọn Đúng hoặc Sai.',
 rows:['Dấu trang (Bookmark) cho phép người dùng điều hướng lại các trang web yêu thích của họ.','Chức năng tải lại cho phép người dùng truy cập một trang web mà họ thường xem.','Tự động điền (Autofill) cho phép trình duyệt tự điền thông tin mà không phải gõ lại.'],a:[1,0,1],
 e:'Tải lại chỉ làm mới trang đang mở; truy cập trang thường xem là việc của Bookmark.'},
{d:3,t:'single',q:'Em làm việc tại tiệm bánh Doe’s Bakery. Người chủ nhờ em đổi danh sách Menu từ kiểu có kí hiệu đầu hàng sang đánh số. Trên tài liệu Word có hai danh sách:\n• Bên trái – "Tiệm bánh Doe’s Bake": mỗi dòng bắt đầu bằng dấu chấm tròn (•): Bánh quy $5, Bánh vòng $10, Cupcake $15, Bánh táo $20, Bông lan $25.\n• Bên phải – "Bạn có thể đặt hàng theo 3 cách": các dòng bắt đầu bằng 1., 2., 3.: Trực tuyến, Qua điện thoại, Tại cửa hàng.\nDanh sách nào là danh sách có kí hiệu đầu hàng?',

{d:3,t:'yesno',cols:['Đánh số','Kí hiệu đầu hàng'],q:'Em hãy chọn "Đánh số" hoặc "Kí hiệu đầu hàng" là loại danh sách phù hợp cho từng tình huống sau.',

{d:3,t:'single',q:'Em làm việc cho tiệm bánh Benny’s Bakery. Menu gồm: Bánh quy, Bánh vòng, Cupcake, Bánh táo, Bông lan. Em đã thêm 4 ảnh mẫu vào Menu (hình máy ảnh, hình bóng bay, hình bánh kem, hình hộp quà) nhưng chỉ cần 1 ảnh. Em nên giữ lại hình ảnh nào?',
 o:['Hình máy ảnh','Hình bóng bay','Hình bánh kem','Hình hộp quà'],a:2,

{d:3,t:'single',q:'Khi viết tài liệu, em nên dùng gì để cho người đọc biết về nội dung sẽ được trình bày trong từng phần?',

{d:3,t:'single',q:'Em được yêu cầu tạo một bài trình chiếu về các chú chó đang chơi đùa. Em hãy chọn hình ảnh phù hợp nhất với chủ đề này:',

{d:3,t:'yesno',cols:['Đúng','Sai'],q:'Em hãy chọn Đúng hoặc Sai với mỗi phát biểu về cách thức định dạng tài liệu.',
 rows:['Tiêu đề tài liệu nên được đặt ở đầu trang.','Việc định dạng văn bản, như in đậm, in nghiêng, màu chữ và kích cỡ to nhỏ, có thể giúp xác định thứ tự tầm quan trọng cho các phần khác nhau ở tài liệu.','Dùng kích cỡ phông chữ khác nhau cho từng đoạn văn giúp dễ đọc và hiểu những phần quan trọng nhất của tài liệu.'],a:[1,1,0],

{d:2,t:'single',q:'Em cần thông tin về một chủ đề cụ thể cho trường học nhưng tìm kiếm ban đầu không trả lại bất kì kết quả hữu ích nào. Em nên thử thao tác gì tiếp theo?',

{d:2,t:'multi',q:'Tùy chọn nào sau đây là ví dụ về công cụ tìm kiếm?',

{d:2,t:'yesno',cols:['Có','Không'],q:'Em hãy chọn Có nếu là nội dung nhằm mục đích giải trí hoặc chọn Không nếu không phải.',

{d:6,t:'single',q:'Lựa chọn nào KHÔNG phải là thông tin đăng nhập có thể được sử dụng để xác thực người dùng?',
